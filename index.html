<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskify - Task Tracker</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>

    <div class="container">
      <img src="assets/acies-logo.png" alt="todo logo" class="todo-logo">

      <h2>TASK TRACKER</h2>

      <div class="add-row">
        <input id="new-task" type="text" placeholder="Enter a task..." autofocus />
        <button id="add-task" type="button">Add</button>
      </div>

      <div class="controls">
        <button id="sort-name" type="button">Sort A–Z</button>
        <button id="sort-status" type="button">Sort by Status</button>
        <button id="mark-all" type="button">Mark All Completed</button>
      </div>

      <ul id="task-list">
        </ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
