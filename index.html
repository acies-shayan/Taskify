<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>To-Do List</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>

    <div class="container">
      <img src="assets\acies-logo.png" alt="todo logo" class="todo-logo">

      <h2>TASK TRACKER</h2>

      <div class="add-row">
        <input id="new-task" type="text" placeholder="Enter a task" />
        <button id="add-task" type="button">Add</button>
      </div>

      <ul id="task-list">
      </ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
